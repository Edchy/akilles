<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First screen: Hold</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{ground}}; color: {{ink}}; font-family: 'EB Garamond', serif; user-select: none; -webkit-user-select: none">

<div style="position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-size: 64px; line-height: 1; font-style: italic; opacity: {{wordOpacity}}">Slowly.</div>

<div style="position: absolute; left: 0; right: 0; top: 726px; height: 2px; background: {{ink}}; opacity: 0.28"></div>

<div style="position: absolute; left: 120px; top: 575px; width: 150px; height: 150px; border-radius: 50%; background: {{disc}}; transform: translateY({{lift}}px)"></div>

<div style="position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; opacity: {{hintOpacity}}">{{hint}}</div>

<button type="button" aria-label="Press and hold to lift it slowly" onPointerDown="{{ press }}" onPointerUp="{{ release }}" onPointerLeave="{{ release }}" onPointerCancel="{{ release }}" onKeyDown="{{ keyDown }}" onKeyUp="{{ keyUp }}" onContextMenu="{{ noMenu }}" style="position: absolute; inset: 0; width: 390px; height: 844px; border: 0; padding: 0; background: transparent; touch-action: none; -webkit-tap-highlight-color: transparent; cursor: pointer; pointer-events: {{holdPointer}}"></button>

<div style="position: absolute; left: 32px; right: 32px; top: 392px; display: flex; flex-direction: column; gap: 18px; text-align: center; opacity: {{doneOpacity}}; pointer-events: {{donePointer}}">
<h1 style="margin: 0; font-size: 46px; line-height: 1.05; font-weight: 400">That is all this is.</h1>
<p style="margin: 0; font-size: 24px; line-height: 1.35">A few things, done slowly, every day.</p>
</div>

<div style="position: absolute; left: 28px; right: 28px; top: 700px; display: flex; flex-direction: column; gap: 10px; opacity: {{doneOpacity}}; pointer-events: {{donePointer}}">
<button type="button" style="height: 62px; border: 0; border-radius: 18px; background: #13325B; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase">Begin</button>
<button type="button" onClick="{{ again }}" style="height: 44px; border: 0; background: transparent; color: #13325B; font-family: 'EB Garamond', serif; font-size: 19px; font-style: italic; cursor: pointer">Feel it once more</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seconds":{"editor":"range","default":3.2,"min":1.5,"max":6,"step":0.1,"unit":"s"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
this.holding = false;
this.last = performance.now();
const tick = (now) => {
const dt = Math.min(0.05, (now - this.last) / 1000);
this.last = now;
const s = this.state || {};
const p = s.p || 0;
if (!s.done) {
const secs = this.props.seconds ?? 3.2;
// Held, it rises at an even pace; let go early, it settles back down.
const next = this.holding ? Math.min(1, p + dt / secs) : Math.max(0, p - dt / 1.1);
if (next !== p) this.setState({ p: next, done: next >= 1 });
} else if ((s.shown || 0) < 1) {
// Arrived: the words come in after it.
this.setState({ shown: Math.min(1, (s.shown || 0) + dt / 0.9) });
}
this.raf = requestAnimationFrame(tick);
};
this.raf = requestAnimationFrame(tick);
}
componentWillUnmount() {
cancelAnimationFrame(this.raf);
}
mix(a, b, t) {
const ch = (hex, i) => parseInt(hex.slice(1 + i * 2, 3 + i * 2), 16);
const out = [0, 1, 2].map((i) => Math.round(ch(a, i) + (ch(b, i) - ch(a, i)) * t));
return 'rgb(' + out.join(',') + ')';
}
renderVals() {
const s = this.state || {};
const p = s.p || 0;
const shown = s.shown || 0;
// Eased, so it leaves the floor gently and arrives gently.
const e = p * p * (3 - 2 * p);
const press = () => {
this.holding = true;
this.setState({ started: true, slipped: false });
};
const release = () => {
const now = this.state || {};
if (this.holding && !now.done && (now.p || 0) > 0.04) this.setState({ slipped: true });
this.holding = false;
};
return {
// Night to first light, as it rises.
ground: this.mix('#0B1220', '#F3E6D6', e),
ink: this.mix('#E6ECF5', '#13325B', e),
disc: this.mix('#B5522A', '#F29A2E', e),
lift: -330 * e,
wordOpacity: s.done ? 1 - shown : 1,
hint: s.slipped && !this.holding ? 'No rush. Hold it.' : 'Press and hold',
hintOpacity: s.done ? 0 : this.holding ? 0.25 : 0.8,
doneOpacity: shown,
donePointer: s.done ? 'auto' : 'none',
holdPointer: s.done ? 'none' : 'auto',
press,
release,
keyDown: (ev) => {
if ((ev.key === ' ' || ev.key === 'Enter') && !ev.repeat) {
ev.preventDefault();
press();
}
},
keyUp: (ev) => {
if (ev.key === ' ' || ev.key === 'Enter') release();
},
noMenu: (ev) => ev.preventDefault(),
again: () => {
this.holding = false;
this.setState({ p: 0, done: false, shown: 0, started: false, slipped: false });
},
};
}
}
</script>
</body>
</html>
